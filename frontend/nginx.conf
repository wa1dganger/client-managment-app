server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- Сертификаты ---
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # --- Протоколы и шифры ---
    # Только TLS 1.2 и 1.3. TLS 1.0/1.1 устарели и небезопасны.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

# --- Резолвер для lazy-DNS ---
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # --- SPA-роутинг ---
    # Любой несуществующий путь отдаёт index.html, чтобы React Router
    # работал при F5 на /clients/123 и т.п.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Проксирование API на backend ---
    location /api/ {
        # Хост в переменной — nginx резолвит его при каждом запросе,
        # а не один раз при старте. Это позволяет frontend стартовать
        # до backend и не падать с "host not found in upstream".
        set $backend_upstream "backend:3001";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto критичен за прокси: backend должен знать,
        # что клиент пришёл по HTTPS, чтобы генерировать правильные URL'ы.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # --- Кеширование статики ---
    # CRA кладёт js/css с хешем в имени — их можно кешировать надолго.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- index.html не кешируем ---
    # Иначе после деплоя клиенты будут грузить старый бандл.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Скрываем версию nginx
    server_tokens off;
}
