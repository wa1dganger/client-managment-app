server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- SPA-роутинг ---
    # Любой несуществующий путь отдаёт index.html, чтобы React Router
    # работал при F5 на /clients/123 и т.п.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Проксирование API на backend-контейнер ---
    # ВАЖНО: без слэша на конце proxy_pass — префикс /api/ сохраняется,
    # т.к. в setupProxy.js не было pathRewrite. Express ждёт именно /api/...
    # Имя "backend" резолвится через Docker DNS (имя сервиса в compose).
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # --- Кеширование статики ---
    # CRA кладёт js/css с хешем в имени — их можно кешировать надолго.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- index.html не кешируем ---
    # Иначе после деплоя клиенты будут грузить старый бандл.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Скрываем версию nginx
    server_tokens off;
}